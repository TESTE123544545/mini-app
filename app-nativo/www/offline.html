<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sem conexão</title>
<style>
  html,body{margin:0;height:100%;background:#070f24;color:#eef1f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:32px 24px;box-sizing:border-box}
  .mark{width:96px;height:96px;margin:0 auto 20px;filter:drop-shadow(0 0 22px rgba(230,196,122,.45))}
  h1{margin:0 0 10px;font-family:Georgia,serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:1.3rem;color:#e6c47a}
  p{margin:0 auto 26px;max-width:30ch;color:#c3cbe0;line-height:1.55}
  button{min-height:52px;padding:0 30px;border:0;border-radius:999px;background:linear-gradient(180deg,#f1d9a0,#d9b26a 55%,#b88f45);color:#0b1633;font:inherit;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem}
</style>
</head>
<body>
<main>
  <div>
    <img class="mark" src="mark.png" alt="">
    <h1>Sem conexão</h1>
    <p>O Veias da Sintonia precisa de internet para abrir sua jornada. Confira o Wi-Fi ou os dados móveis.</p>
    <button type="button" onclick="location.href='https://veiasdasintonia.com.br/'">Tentar de novo</button>
  </div>
</main>
</body>
</html>
